<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in · Portfolio Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <span style="width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1e3a8a,#0d9488);display:inline-block"></span>
        Portfolio Admin
      </div>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to manage your portfolio.</p>

      <form id="loginForm" class="form-grid" autocomplete="on">
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" type="email" id="email" name="email" placeholder="admin@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="••••••••" required minlength="6" />
        </div>
        <div class="field-row" style="justify-content:space-between">
          <label class="muted" style="display:flex;gap:6px;align-items:center;font-weight:400">
            <input type="checkbox" /> Remember me
          </label>
          <a href="#" style="font-size:13px">Forgot password?</a>
        </div>
        <button class="btn" type="submit" style="justify-content:center">Sign in</button>
      </form>

      <p class="muted" style="text-align:center;margin-top:22px;font-size:12px">
        Demo mockup — use any credentials to continue.
      </p>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
